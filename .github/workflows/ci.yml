# .github/workflows/ci.yml

name: dbt CI

on:
  pull_request:
    branches:
      - develop
      - test
      - main

jobs:
  dbt-ci:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      actions: read

    env:
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASS: ${{ secrets.DB_PASS }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_HOST: postgres
      CI_SCHEMA_NAME: dbt_ci_${{ github.run_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dbt-postgres
        run: pip install dbt-postgres

      - name: Download dbt test manifest artifact
        if: github.base_ref == 'test'
        uses: actions/download-artifact@v4
        with:
          name: dbt-test-manifest
          path: dbt_state
      
      - name: Download dbt prod manifest artifact
        if: github.base_ref == 'main'
        uses: actions/download-artifact@v4
        with:
          name: dbt-prod-manifest
          path: dbt_state

      - name: Set up profiles.yml for CI
        # ... (Dynamically generated profiles.yml from previous answers) ...
        # (See final recap for full code)

      - name: Create temporary CI schema
        run: dbt run-operation create_schema --args 'schema_name: ${{ env.CI_SCHEMA_NAME }}'

      - name: Run dbt models with state-based deferral
        run: dbt build --target ci --state dbt_state --defer

      - name: Drop temporary CI schema
        if: always()
        run: dbt run-operation drop_schema --args 'schema_name: ${{ env.CI_SCHEMA_NAME }}'