snapshots:
  - name: mock_orders_snapshot
    description: >
      A snapshot of the mock_orders seed, used to track the history of changes
      to order status over time.
    columns:
      - name: order_id
        description: The unique identifier for each order.
        tests:
          - unique
          - not_null
      - name: status
        description: The current status of the order.
      - name: created_at
        description: The timestamp when the order was created.
      - name: updated_at
        description: The timestamp when the order was last updated.